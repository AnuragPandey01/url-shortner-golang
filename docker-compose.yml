services:

  app:
    build: .
    ports:
      - 8080:8080
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g

  db:
    image: postgres:18.7-alpine
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: url-db
    volumes:
        - pgdata:/var/lib/postgresql

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass password

  adminer:
    image: adminer
    restart: always
    ports:
      - 8000:8080


volumes:
  pgdata:
