services:

  app:
    build: .
    ports:
      - 8080:8080

  db:
    image: postgres:18.7-alpine
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: url-db
    volumes:
        - pgdata:/var/lib/postgresql


  adminer:
    image: adminer
    restart: always
    ports:
      - 8000:8080


volumes:
  pgdata:
